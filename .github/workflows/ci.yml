name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build packages/cli/src/cli.ts --compile --outfile dist/sam

      - name: Verify binary CLI
        run: |
          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi
          "$BIN" --version
          "$BIN" --help

      - name: Smoke test binary portability
        run: |
          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi

          cat > sam-portable.sb <<'SAM'
          schema Ping {
            message: string
          }

          agent MockPing {
            runner: mock,
            workspace: "."
          }

          flow main() {
            let result = use MockPing<Ping>("ping")
            if (!result.ok) {
              return "error"
            }
            return result.value.message
          }
          SAM

          output="$("$BIN" run sam-portable.sb </dev/null)"
          rm -f sam-portable.sb
          echo "Binary output: $output"
          test "$output" = "mock_message"
