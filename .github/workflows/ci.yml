name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run test suite with coverage
        run: bun run test:coverage

  test-and-build:
    name: Test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build packages/cli/src/cli.ts --compile --outfile dist/sam

      - name: Verify binary CLI
        run: |
          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi
          "$BIN" --version
          "$BIN" --help

      - name: Validate Sam automation flows
        run: |
          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi

          shopt -s nullglob
          flows=(ci/sam/*.sb)
          if [ "${#flows[@]}" -eq 0 ]; then
            echo "No Sam automation flows to validate."
            exit 0
          fi

          for flow in "${flows[@]}"; do
            echo "Compiling $flow"
            "$BIN" compile "$flow" > /dev/null
          done

      - name: Smoke test binary portability
        run: |
          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi

          cat > sam-portable.sb <<'SAM'
          schema Ping {
            message: string
          }

          agent MockPing {
            runner: mock,
            workspace: "."
          }

          flow main() {
            let result = use MockPing<Ping>("ping")
            if (!result.ok) {
              return "error"
            }
            return result.value.message
          }
          SAM

          output="$("$BIN" run sam-portable.sb </dev/null)"
          rm -f sam-portable.sb
          echo "Binary output: $output"
          test "$output" = "mock_message"
