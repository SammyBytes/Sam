name: Edition Guard (Sam)

on:
  pull_request:
    paths:
      - "packages/compiler/**"
      - "tests/editions/**"
      - "ci/sam/edition-guard.sb"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: edition-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edition-compatibility:
    name: Edition compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `gh` ships with GitHub-hosted runners. Fail early if that ever changes,
      # instead of failing later while posting the audit comment.
      - name: Verify GitHub CLI
        run: |
          gh --version
          test -n "$GH_TOKEN"

      - name: Validate frozen edition 2026 fixtures
        run: |
          shopt -s nullglob
          fixtures=(tests/editions/2026/*.sb)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error title=Missing edition fixtures::No .sb files found in tests/editions/2026."
            exit 1
          fi

          for file in "${fixtures[@]}" ci/sam/edition-guard.sb; do
            echo "Compiling $file"
            bun packages/cli/src/cli.ts compile "$file" > /dev/null
            bun packages/cli/src/cli.ts ast "$file" > /dev/null
          done

          echo "All edition 2026 fixtures and ci/sam/edition-guard.sb compile."

      - name: Skip audit when GROQ_API_KEY is not configured
        if: env.GROQ_API_KEY == ''
        run: |
          echo "::notice title=Sam edition audit skipped::Add the GROQ_API_KEY repository secret (or run from a branch in this repository, not a fork) to enable the advisory edition audit. Deterministic fixture validation still ran."

      - name: Build compiler diff
        id: diff
        if: env.GROQ_API_KEY != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="origin/$BASE_REF"
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            git fetch --no-tags origin "$BASE_REF:$base"
          fi

          git diff --no-color "$base...HEAD" -- packages/compiler/ > compiler.diff

          if [ ! -s compiler.diff ]; then
            echo "No compiler changes to audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          max_bytes=24000
          diff_bytes="$(wc -c < compiler.diff | tr -d ' ')"
          if [ "$diff_bytes" -gt "$max_bytes" ]; then
            head -c "$max_bytes" compiler.diff > compiler.diff.truncated
            mv compiler.diff.truncated compiler.diff
            echo "::notice title=Edition audit input truncated::The compiler diff was truncated to the first $max_bytes bytes."
          fi

      - name: Run edition audit
        id: audit
        if: env.GROQ_API_KEY != '' && steps.diff.outputs.skip != 'true'
        run: |
          if bun packages/cli/src/cli.ts run ci/sam/edition-guard.sb \
            < compiler.diff \
            > edition-audit.json \
            2> edition-audit.err; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            cat edition-audit.json
            exit 0
          fi

          cat edition-audit.err || true
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Edition audit unavailable::The advisory audit could not be generated. Deterministic fixture validation is unaffected."

      - name: Validate audit schema
        if: env.GROQ_API_KEY != '' && steps.diff.outputs.skip != 'true' && steps.audit.outputs.ok == 'true'
        run: |
          bun -e '
            const data = await Bun.file("edition-audit.json").json();

            const booleans = ["introduces_breaking_syntax", "affects_edition_2026"];
            const strings = ["risk_level", "summary", "recommendation"];

            for (const key of booleans) {
              if (typeof data[key] !== "boolean") {
                console.error(`Invalid EditionAudit.${key}: expected boolean`);
                process.exit(1);
              }
            }
            for (const key of strings) {
              if (typeof data[key] !== "string" || data[key].length === 0) {
                console.error(`Invalid EditionAudit.${key}: expected non-empty string`);
                process.exit(1);
              }
            }
            if (!["low", "medium", "high"].includes(data.risk_level)) {
              console.error("Invalid EditionAudit.risk_level: expected low, medium, or high");
              process.exit(1);
            }

            console.log("Edition audit output matches the expected schema.");
          '

      - name: Render comment
        if: env.GROQ_API_KEY != '' && steps.diff.outputs.skip != 'true' && steps.audit.outputs.ok == 'true'
        run: |
          bun -e '
            const data = await Bun.file("edition-audit.json").json();

            const lines = [
              "<!-- sam-edition-guard -->",
              "## Sam Edition Guard",
              "",
              `**Risk:** \`${data.risk_level}\` · **Affects edition 2026:** \`${data.affects_edition_2026}\``,
              "",
              data.summary,
              "",
              "**Recommendation:** " + data.recommendation,
              "",
              "<sub>Generated by Sam with Groq from the compiler diff. Deterministic fixture compilation always runs; this audit is advisory unless it reports an edition 2026 impact.</sub>",
            ];

            await Bun.write("edition-comment.md", lines.join("\n") + "\n");
          '

      - name: Post or update comment
        if: env.GROQ_API_KEY != '' && steps.diff.outputs.skip != 'true' && steps.audit.outputs.ok == 'true' && env.PR_NUMBER != ''
        env:
          REPO: ${{ github.repository }}
        run: |
          repo="$REPO"
          marker='<!-- sam-edition-guard -->'
          existing="$(gh api --paginate "repos/$repo/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
            | head -n 1)"

          if [ -n "$existing" ]; then
            jq -n --rawfile body edition-comment.md '{body: $body}' > edition-comment.json
            gh api -X PATCH "repos/$repo/issues/comments/$existing" \
              --input edition-comment.json > /dev/null
            echo "Updated edition guard comment $existing."
          else
            gh pr comment "$PR_NUMBER" --body-file edition-comment.md
            echo "Created edition guard comment."
          fi

      - name: Enforce edition 2026 compatibility
        if: env.GROQ_API_KEY != '' && steps.diff.outputs.skip != 'true' && steps.audit.outputs.ok == 'true'
        run: |
          bun -e '
            const data = await Bun.file("edition-audit.json").json();

            if (data.affects_edition_2026 === true) {
              console.error(`::error title=Edition 2026 compatibility::${data.summary} Recommendation: ${data.recommendation}`);
              process.exit(1);
            }

            console.log("No edition 2026 compatibility impact reported.");
          '
