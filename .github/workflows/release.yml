name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Compile and package standalone binary
        run: |
          mkdir -p dist release
          bun build packages/cli/src/cli.ts --compile --outfile dist/sam

          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   NAME="sam-linux-x64" ;;
            Linux-ARM64) NAME="sam-linux-arm64" ;;
            macOS-X64)   NAME="sam-darwin-x64" ;;
            macOS-ARM64) NAME="sam-darwin-arm64" ;;
            Windows-X64)   NAME="sam-windows-x64.exe" ;;
            Windows-ARM64) NAME="sam-windows-arm64.exe" ;;
            *) NAME="sam-${RUNNER_OS}-${RUNNER_ARCH}" ;;
          esac

          cp "$BIN" "release/$NAME"

      - name: Upload platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash

    steps:
      # `gh release create`/`upload` resolve the repository from the git
      # remote, so the publish job needs a checkout even though it only
      # handles artifacts.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum sam-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          ls -lh release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" release/* --generate-notes --title "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
