name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Compile and package standalone binary
        run: |
          mkdir -p dist release
          bun build packages/cli/src/cli.ts --compile --outfile dist/sam

          BIN="dist/sam"
          if [ -f "dist/sam.exe" ]; then
            BIN="dist/sam.exe"
          fi

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   NAME="sam-linux-x64" ;;
            Linux-ARM64) NAME="sam-linux-arm64" ;;
            macOS-X64)   NAME="sam-darwin-x64" ;;
            macOS-ARM64) NAME="sam-darwin-arm64" ;;
            Windows-X64)   NAME="sam-windows-x64.exe" ;;
            Windows-ARM64) NAME="sam-windows-arm64.exe" ;;
            *) NAME="sam-${RUNNER_OS}-${RUNNER_ARCH}" ;;
          esac

          cp "$BIN" "release/$NAME"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "$TAG"
          fi
