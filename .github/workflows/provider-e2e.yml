name: Provider E2E (Groq)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: provider-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groq-live:
    name: Live Groq provider flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: llama-3.1-8b-instant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: bun install --frozen-lockfile

      - name: Skip live test when GROQ_API_KEY is not configured
        if: env.GROQ_API_KEY == ''
        run: |
          echo "::notice title=Groq E2E skipped::Add the GROQ_API_KEY repository secret to run the live provider test."

      - name: Compile standalone binary
        if: env.GROQ_API_KEY != ''
        run: bun run build:bin

      - name: Run chained provider flow against Groq
        if: env.GROQ_API_KEY != ''
        run: |
          output="$(./dist/sam run examples/provider-groq-ci.sb "function add(a, b) { return a + b }")"
          echo "$output"
          echo "$output" | jq -e '.summary | type == "string" and length > 0' >/dev/null

      - name: Verify invalid credentials produce PROVIDER_HTTP_ERROR
        if: env.GROQ_API_KEY != ''
        run: |
          set +e
          output="$(GROQ_API_KEY=invalid ./dist/sam run examples/provider-groq-ci.sb "function add(a, b) { return a + b }" 2>&1)"
          status=$?
          set -e

          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q 'PROVIDER_HTTP_ERROR'
